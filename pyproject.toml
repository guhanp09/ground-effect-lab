[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ground-effect-lab"
version = "0.1.0"
description = "Discrete lifting-line ground effect and coupled electric mission sizing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8,<10", "matplotlib>=3.8,<4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
